name: Update BTC Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-btc-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/update-btc-data.mjs
      - name: Warm crypto-summary CDN
        run: |
          curl -fsS \
            -A "mehk3y-warm/1.0 (+https://mehk3y.com)" \
            "https://mehk3y.com/api/crypto-summary" \
            -o /dev/null \
            -w "warm status:%{http_code} total:%{time_total}s\n"
      - name: Commit data
        run: |
          if git diff --quiet -- data/btc.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/btc.json
          git commit -m "Update BTC data"
          git push
