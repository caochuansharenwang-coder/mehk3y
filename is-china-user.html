<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Mehk3y — 中国用户环境检测</title>
  <meta name="description" content="浏览器侧判断当前环境是否更像中国用户：语言、时区、Emoji、字体和网络出口探测。">
  <meta property="og:title" content="Mehk3y — 中国用户环境检测">
  <meta property="og:description" content="移植自 isChinaUser：语言 · 时区 · Emoji · 字体 · 网络出口">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mehk3y.com/is-china-user">
  <meta property="og:image" content="https://mehk3y.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@Mehk3y">
  <meta name="twitter:image" content="https://mehk3y.com/og-image.jpg">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://mehk3y.com/is-china-user">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/common.css">
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/theme.js"></script>
  <link rel="preload" as="script" href="/common.js">
  <link rel="preload" as="script" href="/is-china-user.js">
  <link rel="dns-prefetch" href="https://www.baidu.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://chatgpt.com">
  <style>
    .wrap { max-width: 680px; }
    .hdr { align-items: baseline; margin-bottom: 16px; }
    .divider { margin-bottom: 20px; }
    .strip { margin-bottom: 18px; }
    .strip-item { min-width: 0; }
    .result-main.is-yes { color: var(--red); }
    .result-main.is-no { color: var(--green); }
    .result-note { margin-top: 7px; font-size: 12px; color: var(--dim); line-height: 1.55; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
    .toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 34px;
      padding: 8px 13px;
      border: 1px solid var(--border-2);
      border-radius: 99px;
      background: var(--bg);
      color: var(--text);
      font: 600 12px 'Geist', inherit;
      cursor: pointer;
      transition: background-color .2s, border-color .2s, transform .2s;
    }
    .toggle:hover { background: var(--surface); border-color: var(--dim); }
    .toggle:active { transform: scale(.98); }
    .toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .switch {
      width: 28px;
      height: 16px;
      border-radius: 999px;
      background: var(--border-2);
      position: relative;
      flex: 0 0 auto;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: var(--shadow-sm);
      transition: transform .2s var(--ease), background-color .2s;
    }
    .toggle[aria-pressed="true"] .switch { background: color-mix(in srgb, var(--accent-fg) 35%, transparent); }
    .toggle[aria-pressed="true"] .switch::after {
      transform: translateX(12px);
      background: var(--accent-fg);
    }
    .network-btn { margin-left: auto; }
    .signals { margin-bottom: 16px; }
    .signal-card { padding: 14px 16px; min-height: 118px; }
    .signal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
    .signal-title { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }
    .pill.yes { background: var(--tint-red-bg); color: var(--tint-red-fg); }
    .pill.no { background: var(--tint-green-bg); color: var(--tint-green-fg); }
    .pill.unknown { background: var(--tint-yellow-bg); color: var(--tint-yellow-fg); }
    .signal-detail {
      font-size: 12px;
      line-height: 1.65;
      color: var(--dim);
      overflow-wrap: anywhere;
    }
    .probe-list {
      margin-top: 8px;
      display: grid;
      gap: 0;
      border-top: 1px solid var(--border);
    }
    .probe-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      color: var(--dim);
      border-bottom: 1px solid var(--border);
      padding: 6px 0;
      overflow-wrap: anywhere;
    }
    .note {
      color: var(--dim);
      font-size: 11px;
      line-height: 1.65;
      margin: 4px 0 20px;
    }
    .note a { color: var(--text); font-weight: 650; text-decoration: none; }
    @media (max-width: 700px) {
      .network-btn { width: 100%; margin-left: 0; }
      .controls .toggle { flex: 1 1 calc(50% - 4px); }
    }
    @media (max-width: 420px) {
      .controls .toggle { flex-basis: 100%; }
    }
  </style>
</head>
<body>
<a href="#main" class="skip-link">跳到内容</a>
<div class="site-top"><button class="theme-toggle" data-theme-toggle type="button" aria-label="切换主题" title="主题"><svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 0 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button></div>
<main class="wrap" id="main">
  <header class="hdr">
    <div class="hdr-left">
      <a href="/" class="hdr-back">←</a>
      <a href="/" class="hdr-name">Mehk3y</a>
      <span class="hdr-sub">中国用户环境检测</span>
    </div>
  </header>
  <div class="divider"></div>

  <section class="strip" aria-label="检测结论">
    <div class="strip-item">
      <div class="strip-label">isChinaUser()</div>
      <div class="strip-val result-main" id="result-title">检测中</div>
      <p class="result-note" id="result-sub">正在读取浏览器语言、时区、Emoji 和字体信号。</p>
    </div>
    <div class="strip-item">
      <div class="strip-label" id="score-label">同步信号</div>
      <div class="strip-val" id="score-value">0/4</div>
      <p class="result-note">网络出口检测需手动触发</p>
    </div>
  </section>

  <section class="controls" aria-label="检测选项">
    <button class="toggle" id="mainland-toggle" type="button" aria-pressed="false">
      <span>仅判断中国大陆</span>
      <span class="switch" aria-hidden="true"></span>
    </button>
    <button class="toggle" id="strict-toggle" type="button" aria-pressed="false">
      <span>严格模式</span>
      <span class="switch" aria-hidden="true"></span>
    </button>
    <button class="btn-pill network-btn" id="network-btn" type="button">检测网络出口</button>
  </section>

  <div class="section-title">信号明细</div>
  <section class="grid2 signals" id="signals" aria-label="信号明细"></section>

  <p class="note">
    这个页面移植自 <a href="https://github.com/yArna/isChinaUser" target="_blank" rel="noopener">yArna/isChinaUser</a> 的浏览器判断逻辑。同步判断不读取 IP；网络出口检测需要手动触发，会加载百度、gstatic 和 ChatGPT 的 favicon 探针，结果会受代理、VPN、浏览器扩展和 CSP 影响。
  </p>

  <div class="footer"><a href="/">← 返回首页</a></div>
</main>
<script src="/common.js" defer></script>
<script src="/is-china-user.js" defer></script>
<script src="/analytics.js" defer></script>
</body>
</html>
