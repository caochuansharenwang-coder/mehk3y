<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">

  <title>Mehk3y — 中国用户环境检测</title>
  <meta name="description" content="浏览器侧判断当前环境是否更像中国用户：语言、时区、Emoji、字体和网络出口探测。">

  <script src="/theme.js"></script>
  <link rel="preload" as="script" href="/common.js">
  <link rel="preload" as="script" href="/is-china-user.js">
  <link rel="dns-prefetch" href="https://www.baidu.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://chatgpt.com">
  <style>
    .wrap { max-width: 760px; }
    .hdr { align-items: baseline; margin-bottom: 16px; }
    .hero-panel {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(190px, .85fr);
      gap: 14px;
      margin-bottom: 14px;
    }
    .result-card {
      padding: 20px;
      min-height: 166px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .result-kicker {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .result-main {
      margin: 14px 0 8px;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-weight: 800;
    }
    .result-main.is-yes { color: var(--tint-red-fg); }
    .result-main.is-no { color: var(--tint-green-fg); }
    .result-sub {
      color: var(--dim);
      font-size: 13px;
      line-height: 1.6;
    }
    .score-card {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    .score-ring {
      width: 116px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto;
      background: conic-gradient(var(--accent) var(--score-angle, 0deg), var(--border) 0);
      position: relative;
    }
    .score-ring::after {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      background: var(--surface);
    }
    .score-ring strong {
      position: relative;
      z-index: 1;
      font-size: 28px;
      letter-spacing: -0.04em;
    }
    .score-label {
      text-align: center;
      font-size: 12px;
      color: var(--dim);
      line-height: 1.5;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .2s, background-color .2s, transform .2s;
    }
    .toggle:hover { border-color: var(--border-2); background: var(--surface-2); }
    .toggle:active { transform: scale(.99); }
    .toggle span:first-child {
      font-size: 12px;
      font-weight: 650;
      line-height: 1.25;
    }
    .switch {
      width: 34px;
      height: 20px;
      border-radius: 999px;
      background: var(--border-2);
      position: relative;
      flex: 0 0 auto;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: var(--shadow-sm);
      transition: transform .2s var(--ease), background-color .2s;
    }
    .toggle[aria-pressed="true"] .switch { background: var(--accent); }
    .toggle[aria-pressed="true"] .switch::after {
      transform: translateX(14px);
      background: var(--accent-fg);
    }
    .network-btn {
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: var(--accent);
      color: var(--accent-fg);
      font: 700 12px 'Geist', inherit;
      cursor: pointer;
      min-height: 54px;
      padding: 0 14px;
      transition: transform .2s, opacity .2s;
    }
    .network-btn:active { transform: scale(.99); }
    .network-btn:disabled { opacity: .55; cursor: not-allowed; }
    .signals {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .signal-card {
      padding: 15px;
      min-height: 124px;
    }
    .signal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
    }
    .signal-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }
    .pill.yes { background: var(--tint-red-bg); color: var(--tint-red-fg); }
    .pill.no { background: var(--tint-green-bg); color: var(--tint-green-fg); }
    .pill.unknown { background: var(--tint-yellow-bg); color: var(--tint-yellow-fg); }
    .signal-detail {
      font-size: 12px;
      line-height: 1.65;
      color: var(--dim);
      overflow-wrap: anywhere;
    }
    .probe-list {
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }
    .probe-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      color: var(--dim);
      border-top: 1px solid var(--border);
      padding-top: 6px;
      overflow-wrap: anywhere;
    }
    .note {
      margin-top: 14px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--dim);
      font-size: 12px;
      line-height: 1.7;
      background: var(--bg);
    }
    .note a { color: var(--text); font-weight: 650; text-decoration: none; }
    @media (max-width: 700px) {
      .hero-panel, .signals, .controls { grid-template-columns: 1fr; }
      .result-main { font-size: 30px; }
      .score-ring { width: 104px; }
    }
  </style>
</head>
<body>

<main class="wrap" id="main">
  <header class="hdr">
    <div class="hdr-left">
      <a href="/" class="hdr-back">←</a>
      <a href="/" class="hdr-name">Mehk3y</a>
      <span class="hdr-sub">中国用户环境检测</span>
    </div>
  </header>
  <div class="divider"></div>

  <section class="hero-panel" aria-label="检测结论">
    <div class="card result-card">
      <div>
        <div class="result-kicker">isChinaUser()</div>
        <h1 class="result-main" id="result-title">检测中</h1>
        <p class="result-sub" id="result-sub">正在读取浏览器语言、时区、Emoji 和字体信号。</p>
      </div>
    </div>
    <div class="card score-card">
      <div class="score-ring" id="score-ring"><strong id="score-value">0/4</strong></div>
      <div class="score-label" id="score-label">同步信号命中数量</div>
    </div>
  </section>

  <section class="controls" aria-label="检测选项">
    <button class="toggle" id="mainland-toggle" type="button" aria-pressed="false">
      <span>仅判断中国大陆</span>
      <span class="switch" aria-hidden="true"></span>
    </button>
    <button class="toggle" id="strict-toggle" type="button" aria-pressed="false">
      <span>严格模式</span>
      <span class="switch" aria-hidden="true"></span>
    </button>
    <button class="network-btn" id="network-btn" type="button">检测网络出口</button>
  </section>

  <section class="signals" id="signals" aria-label="信号明细"></section>

  <div class="note">
    这个页面移植自 <a href="https://github.com/yArna/isChinaUser" target="_blank" rel="noopener">yArna/isChinaUser</a> 的浏览器判断逻辑。同步判断不读取 IP；网络出口检测需要手动触发，会加载百度、gstatic 和 ChatGPT 的 favicon 探针，结果会受代理、VPN、浏览器扩展和 CSP 影响。
  </div>

  <div class="footer"><a href="/">← 返回首页</a></div>
</main>
