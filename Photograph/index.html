    body {
      background: var(--bg);

<body>
  <h1>照片漫画化</h1>
  <p class="intro">上传一张照片，或用手机摄像头拍一张，浏览器内一键转成漫画描边、像素风或黑白线稿，强度可调，满意后直接下载。图片不会上传服务器，全程在你本机处理。</p>

  <div class="stage">
    <div class="canvas-wrap">
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.2"/><path d="M8 6l1.2-2h5.6L16 6"/></svg>
        还没有照片<br>点下面「传入照片」或「打开相机」开始
      </div>
      <canvas id="outCanvas"></canvas>
      <div class="busy" id="busy">处理中…</div>
    </div>

    <div class="controls">
      <div class="row">
        <label class="btn" for="fileInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/><path d="M12 5v12"/></svg>

        </label>
        <button class="btn" id="camBtn">

        </button>

      <div class="row">
        <button class="btn ghost" id="resetBtn" disabled>还原原图</button>
        <button class="btn" id="dlBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13l-2-2M21 17H8l2 2"/><path d="M16 7a5 5 0 0 1 5 5M8 17a5 5 0 0 1-5-5"/></svg>
      </button>
      <button class="shutter" id="shutter" title="拍照"></button>
      <span style="width:46px"></span>

<script>
(function () {
  'use strict';

  var srcCanvas = document.createElement('canvas'); // holds original image pixels
  var out = document.getElementById('outCanvas');
  var octx = out.getContext('2d', { willReadFrequently: true });
  var placeholder = document.getElementById('placeholder');
  var busy = document.getElementById('busy');
  var dlBtn = document.getElementById('dlBtn');
  var resetBtn = document.getElementById('resetBtn');
  var strengthEl = document.getElementById('strength');
  var strengthVal = document.getElementById('strengthVal');
  var styleRow = document.getElementById('styleRow');

  var hasImage = false;
  var curStyle = 'comic';
  var strengthLabels = { 1: '很弱', 2: '弱', 3: '中', 4: '强', 5: '很强' };

  var MAXDIM = 1400; // cap processing size for speed

  // ---------- load image into srcCanvas ----------
  function setImage(img) {
    var w = img.width, h = img.height;
    var scale = Math.min(1, MAXDIM / Math.max(w, h));
    w = Math.round(w * scale); h = Math.round(h * scale);
    srcCanvas.width = w; srcCanvas.height = h;
    srcCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
    hasImage = true;
    placeholder.style.display = 'none';
    out.style.display = 'block';
    dlBtn.disabled = false;
    resetBtn.disabled = false;
    render();
  }

  function loadFromFile(file) {
    var img = new Image();
    img.onload = function () { setImage(img); URL.revokeObjectURL(img.src); };
    img.src = URL.createObjectURL(file);
  }

  // ---------- comic pipeline ----------
  function render() {
    if (!hasImage) return;
    busy.classList.add('show');
    // let the browser paint the busy overlay before heavy work
    setTimeout(function () {
      try { process(); } finally { busy.classList.remove('show'); }
    }, 16);
  }

  function process() {
    var w = srcCanvas.width, h = srcCanvas.height;
    out.width = w; out.height = h;
    var sctx = srcCanvas.getContext('2d', { willReadFrequently: true });
    var src = sctx.getImageData(0, 0, w, h);

    var s = parseInt(strengthEl.value, 10); // 1..5

    if (curStyle === 'pixel') {
      renderPixel(src, w, h, s);
      return;
    }
    if (curStyle === 'ink') {
      renderInk(src, w, h, s);
      return;
    }

    // ---- comic: flat color regions + clean black outlines ----
    // 1) smoothing passes (more passes = flatter, more cartoon)
    var passes = 1 + Math.round(s * 0.8);
    var smooth = src;
    for (var p = 0; p < passes; p++) smooth = boxBlur(smooth, w, h, 1);

    // 2) color quantization (posterize) — fewer levels at higher strength
    var levels = [8, 6, 5, 4, 3][s - 1];
    var quant = posterize(smooth, levels);

    // 3) saturation boost for punch
    saturate(quant, 1.18);

    // 4) clean edge overlay: detect on denoised gray, high threshold, then despeckle
    var edges = cleanEdges(src, w, h, [70, 58, 48, 40, 34][s - 1]);
    overlayEdges(quant, edges);

    octx.putImageData(quant, 0, 0);
  }

  function renderInk(src, w, h, s) {
    // grayscale + clean strong edges => tidy line art
    var edges = cleanEdges(src, w, h, [82, 68, 56, 46, 38][s - 1]);
    var d = new ImageData(w, h);
    for (var i = 0; i < edges.length; i++) {
      var v = edges[i] ? 0 : 255;
      var j = i * 4;
      d.data[j] = d.data[j + 1] = d.data[j + 2] = v;
      d.data[j + 3] = 255;
    }
    octx.putImageData(d, 0, 0);
  }

  function renderPixel(src, w, h, s) {
    // downscale to a small grid, quantize colors, upscale with nearest-neighbor => blocky 8-bit look
    var block = [6, 9, 13, 18, 26][s - 1];           // pixel size (bigger = chunkier)
    var levels = [6, 5, 4, 4, 3][s - 1];             // colors per channel
    var gw = Math.max(1, Math.round(w / block));
    var gh = Math.max(1, Math.round(h / block));

    // average each block -> small grid
    var small = new ImageData(gw, gh);
    var sd = src.data, dd = small.data;
    for (var gy = 0; gy < gh; gy++) {
      for (var gx = 0; gx < gw; gx++) {
        var x0 = Math.floor(gx * w / gw), x1 = Math.floor((gx + 1) * w / gw);
        var y0 = Math.floor(gy * h / gh), y1 = Math.floor((gy + 1) * h / gh);
        var r = 0, g = 0, b = 0, n = 0;
        for (var yy = y0; yy < y1; yy++) {
          for (var xx = x0; xx < x1; xx++) {
            var o = (yy * w + xx) * 4;
            r += sd[o]; g += sd[o + 1]; b += sd[o + 2]; n++;
          }
        }
        var di = (gy * gw + gx) * 4;
        dd[di] = r / n; dd[di + 1] = g / n; dd[di + 2] = b / n; dd[di + 3] = 255;
      }
    }
    // quantize for a retro palette + slight saturation
    var q = posterize(small, levels);
    saturate(q, 1.25);

    // upscale nearest-neighbor onto output
    out.width = w; out.height = h;
    var tmp = document.createElement('canvas');
    tmp.width = gw; tmp.height = gh;
    tmp.getContext('2d').putImageData(q, 0, 0);
    octx.imageSmoothingEnabled = false;
    octx.clearRect(0, 0, w, h);
    octx.drawImage(tmp, 0, 0, gw, gh, 0, 0, w, h);
  }

  // Edge detection that suppresses speckle: blur -> sobel -> threshold -> remove isolated pixels.
  // Returns Uint8Array (1 = edge, 0 = not).
  function cleanEdges(src, w, h, thr) {
    var blurred = boxBlur(src, w, h, 1);       // denoise first
    var mag = sobel(blurred, w, h);
    var bin = new Uint8Array(w * h);
    for (var i = 0; i < mag.length; i++) bin[i] = mag[i] >= thr ? 1 : 0;
    // despeckle: drop edge pixels with <2 edge neighbours (kills lone dots/grain)
    var out = new Uint8Array(w * h);
    for (var y = 1; y < h - 1; y++) {
      for (var x = 1; x < w - 1; x++) {
        var o = y * w + x;
        if (!bin[o]) continue;
        var n = bin[o-w-1]+bin[o-w]+bin[o-w+1]+bin[o-1]+bin[o+1]+bin[o+w-1]+bin[o+w]+bin[o+w+1];
        out[o] = n >= 2 ? 1 : 0;
      }
    }
    return out;
  }

  // ---------- pixel ops ----------
  function boxBlur(img, w, h, r) {
    // separable 3x3-ish box blur (radius r)
    var src = img.data;
    var tmp = new Uint8ClampedArray(src.length);
    var out = new Uint8ClampedArray(src.length);
    var x, y, c, k, sum, cnt, idx;
    // horizontal
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        for (c = 0; c < 3; c++) {
          sum = 0; cnt = 0;
          for (k = -r; k <= r; k++) {
            var xx = x + k;
            if (xx < 0 || xx >= w) continue;
            sum += src[(y * w + xx) * 4 + c]; cnt++;
          }
          tmp[(y * w + x) * 4 + c] = sum / cnt;
        }
        tmp[(y * w + x) * 4 + 3] = 255;
      }
    }
    // vertical
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        for (c = 0; c < 3; c++) {
          sum = 0; cnt = 0;
          for (k = -r; k <= r; k++) {
            var yy = y + k;
            if (yy < 0 || yy >= h) continue;
            sum += tmp[(yy * w + x) * 4 + c]; cnt++;
          }
          out[(y * w + x) * 4 + c] = sum / cnt;
        }
        out[(y * w + x) * 4 + 3] = 255;
      }
    }
    return new ImageData(out, w, h);
  }

  function posterize(img, levels) {
    var d = new Uint8ClampedArray(img.data);
    var step = 255 / (levels - 1);
    for (var i = 0; i < d.length; i += 4) {
      d[i]   = Math.round(Math.round(d[i]   / step) * step);
      d[i+1] = Math.round(Math.round(d[i+1] / step) * step);
      d[i+2] = Math.round(Math.round(d[i+2] / step) * step);
    }
    return new ImageData(d, img.width, img.height);
  }

  function saturate(img, amt) {
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var r = d[i], g = d[i+1], b = d[i+2];
      var gray = 0.299 * r + 0.587 * g + 0.114 * b;
      d[i]   = gray + (r - gray) * amt;
      d[i+1] = gray + (g - gray) * amt;
      d[i+2] = gray + (b - gray) * amt;
    }
  }

  function sobel(img, w, h) {
    var d = img.data;
    var gray = new Float32Array(w * h);
    for (var i = 0, j = 0; i < d.length; i += 4, j++) {
      gray[j] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    }
    var mag = new Float32Array(w * h);
    for (var y = 1; y < h - 1; y++) {
      for (var x = 1; x < w - 1; x++) {
        var o = y * w + x;
        var tl = gray[o - w - 1], t = gray[o - w], tr = gray[o - w + 1];
        var l = gray[o - 1],                       rr = gray[o + 1];
        var bl = gray[o + w - 1], bb = gray[o + w], br = gray[o + w + 1];
        var gx = (tr + 2 * rr + br) - (tl + 2 * l + bl);
        var gy = (bl + 2 * bb + br) - (tl + 2 * t + tr);
        mag[o] = Math.sqrt(gx * gx + gy * gy);
      }
    }
    return mag;
  }

  function overlayEdges(img, edges) {
    var d = img.data;
    for (var i = 0; i < edges.length; i++) {
      if (edges[i]) {
        var j = i * 4;
        d[j] = d[j+1] = d[j+2] = 0; // black line
      }
    }
  }

  // ---------- download ----------
  dlBtn.addEventListener('click', function () {
    if (!hasImage) return;
    var a = document.createElement('a');
    a.download = 'comic-' + Date.now() + '.png';
    a.href = out.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
  });

  resetBtn.addEventListener('click', function () {
    if (!hasImage) return;
    out.width = srcCanvas.width; out.height = srcCanvas.height;
    octx.drawImage(srcCanvas, 0, 0);
  });

  // ---------- controls ----------
  document.getElementById('fileInput').addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) loadFromFile(e.target.files[0]);
  });
  strengthEl.addEventListener('input', function () {
    strengthVal.textContent = strengthLabels[strengthEl.value];
    render();
  });
  styleRow.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    [].forEach.call(styleRow.children, function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    curStyle = chip.dataset.style;
    render();
  });

  // ---------- camera ----------
  var cam = document.getElementById('cam');
  var video = document.getElementById('video');
  var stream = null, facing = 'environment';

  function openCam() {
    cam.classList.add('active');
    startStream();
  }
  function startStream() {
    stopStream();
    navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false })
      .then(function (s) { stream = s; video.srcObject = s; })
      .catch(function () { alert('无法访问摄像头，请检查浏览器权限。'); closeCam(); });
  }
  function stopStream() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }
  function closeCam() { stopStream(); cam.classList.remove('active'); }

  document.getElementById('camBtn').addEventListener('click', function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('当前浏览器不支持调用摄像头，请改用「传入照片」。');
      return;
    }
    openCam();
  });
  document.getElementById('camClose').addEventListener('click', closeCam);
  document.getElementById('flipBtn').addEventListener('click', function () {
    facing = facing === 'environment' ? 'user' : 'environment';
    startStream();
  });
  document.getElementById('shutter').addEventListener('click', function () {
    if (!video.videoWidth) return;
    var c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    var img = new Image();
    img.onload = function () { setImage(img); };
    img.src = c.toDataURL('image/png');
    closeCam();
  });
})();
</script>
</body>
</html>
