<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Exercises 动作库 — Mehk3y</title>
  <meta name="description" content="1324 个健身动作数据浏览器，支持按部位、器械、目标肌群筛选，并查看中英等 6 种语言动作说明。">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="Exercises 动作库 — Mehk3y">
  <meta property="og:description" content="1324 个健身动作，按部位、器械、目标肌群快速筛选。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mehk3y.com/exercises">
  <meta property="og:image" content="https://mehk3y.com/og-image.jpg">
  <link rel="canonical" href="https://mehk3y.com/exercises">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/common.css">
  <script src="/theme.js"></script>
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 12%, rgba(22, 163, 74, .10), transparent 24%),
        radial-gradient(circle at 88% 10%, rgba(37, 99, 235, .08), transparent 28%),
        var(--bg);
    }

    .exercise-shell {
      width: min(100%, 1280px);
      margin: 0 auto;
      padding: 24px 20px 42px;
      position: relative;
      z-index: 1;
    }

    .page-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      margin-bottom: 18px;
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .home-link {
      height: 32px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--dim);
      background: var(--bg);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .home-link:hover { color: var(--text); border-color: var(--border-2); }

    .eyebrow {
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 58px);
      line-height: .96;
      letter-spacing: 0;
      margin: 0;
    }

    .lead {
      max-width: 680px;
      color: var(--dim);
      font-size: 15px;
      line-height: 1.7;
      margin-top: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 22px 0 18px;
    }

    .stat {
      min-height: 82px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 15px;
    }

    .stat-label {
      color: var(--dim);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      color: var(--text);
      font-size: 25px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .workspace {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 360px;
      gap: 14px;
      align-items: start;
    }

    .filters,
    .results,
    .detail {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      min-width: 0;
    }

    .filters {
      position: sticky;
      top: 14px;
      padding: 14px;
      max-height: calc(100vh - 28px);
      overflow: auto;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      padding: 0 38px 0 13px;
      font: inherit;
      font-size: 14px;
    }

    .search:focus { border-color: var(--text-2); box-shadow: var(--ring); }

    .clear-search {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      display: none;
    }

    .clear-search.visible { display: inline-flex; align-items: center; justify-content: center; }
    .clear-search:hover { background: var(--surface); color: var(--text); }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 12px;
    }

    .field label,
    .filter-label {
      color: var(--dim);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
    }

    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 8px 0 14px;
    }

    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text-2);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 10px;
      text-transform: capitalize;
    }

    .chip.active {
      border-color: rgba(22, 163, 74, .42);
      background: rgba(22, 163, 74, .12);
      color: var(--green);
    }

    .notice {
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.65;
    }

    .notice a { color: var(--text); font-weight: 700; }

    .results {
      overflow: hidden;
    }

    .results-top {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
    }

    .count {
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .hint {
      color: var(--dim);
      font-size: 12px;
      text-align: right;
    }

    .list {
      display: grid;
      max-height: calc(100vh - 260px);
      min-height: 540px;
      overflow: auto;
    }

    .exercise-card {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 86px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      padding: 12px 14px;
      font: inherit;
    }

    .exercise-card:hover,
    .exercise-card.active {
      background: var(--surface);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(22, 163, 74, .12);
      color: var(--green);
      border: 1px solid rgba(22, 163, 74, .22);
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .card-title {
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
      text-transform: capitalize;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--dim);
      background: var(--bg);
      padding: 0 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .empty {
      min-height: 420px;
      display: grid;
      place-items: center;
      color: var(--dim);
      text-align: center;
      padding: 32px;
      line-height: 1.7;
    }

    .detail {
      position: sticky;
      top: 14px;
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding: 18px;
    }

    .detail-placeholder {
      min-height: 420px;
      display: grid;
      place-items: center;
      color: var(--dim);
      text-align: center;
      line-height: 1.7;
    }

    .detail-kicker {
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .detail-title {
      color: var(--text);
      font-size: 27px;
      line-height: 1.12;
      letter-spacing: 0;
      text-transform: capitalize;
      margin-bottom: 14px;
    }

    .lang-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .lang-tab {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--dim);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 10px;
    }

    .lang-tab.active {
      border-color: var(--text);
      color: var(--text);
    }

    .section {
      border-top: 1px solid var(--border);
      margin-top: 16px;
      padding-top: 16px;
    }

    .section h2 {
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .steps {
      display: grid;
      gap: 10px;
      counter-reset: step;
      list-style: none;
    }

    .steps li {
      counter-increment: step;
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      color: var(--text-2);
      font-size: 14px;
      line-height: 1.6;
    }

    .steps li::before {
      content: counter(step);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
    }

    .muscles {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .meta-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 10px;
    }

    .meta-label {
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .meta-value {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      text-transform: capitalize;
      overflow-wrap: anywhere;
    }

    .source {
      color: var(--dim);
      font-size: 12px;
      line-height: 1.65;
    }

    .source code {
      color: var(--text-2);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 5px;
    }

    @media (max-width: 1080px) {
      .workspace {
        grid-template-columns: 270px minmax(0, 1fr);
      }
      .detail {
        grid-column: 1 / -1;
        position: static;
        max-height: none;
      }
      .list {
        max-height: none;
        min-height: 460px;
      }
    }

    @media (max-width: 760px) {
      .exercise-shell { padding: 18px 12px 30px; }
      .page-head { grid-template-columns: 1fr; }
      .head-actions { justify-content: space-between; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace { grid-template-columns: 1fr; }
      .filters {
        position: static;
        max-height: none;
      }
      .results-top {
        align-items: flex-start;
        flex-direction: column;
      }
      .hint { text-align: left; }
      .list { min-height: 360px; }
      .detail-title { font-size: 23px; }
    }
  </style>
</head>
<body>
  <main class="exercise-shell">
    <header class="page-head">
      <div>
        <div class="eyebrow">Exercises Dataset</div>
        <h1>健身动作库</h1>
        <p class="lead">本地集成 hasaneyldrm/exercises-dataset：1324 个动作，覆盖部位、器械、目标肌群与 6 种语言说明。媒体文件未包含，这里专注做可搜索的数据浏览器。</p>
      </div>
      <div class="head-actions">
        <a class="home-link" href="/">返回 Mehk3y</a>
        <button class="theme-toggle" data-theme-toggle type="button" aria-label="切换主题" title="主题">
          <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <section class="stats" aria-label="数据概览">
      <div class="stat">
        <div class="stat-label">动作</div>
        <div class="stat-value" id="statTotal">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">身体部位</div>
        <div class="stat-value" id="statCategories">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">器械类型</div>
        <div class="stat-value" id="statEquipment">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">说明语言</div>
        <div class="stat-value">6</div>
      </div>
    </section>

    <section class="workspace">
      <aside class="filters" aria-label="筛选">
        <div class="search-wrap">
          <input class="search" id="searchInput" type="search" placeholder="搜索动作、肌群、器械..." autocomplete="off">
          <button class="clear-search" id="clearSearch" type="button" aria-label="清空搜索">×</button>
        </div>

        <div class="field">
          <label for="categorySelect">身体部位</label>
          <select id="categorySelect"></select>
        </div>

        <div class="field">
          <label for="equipmentSelect">器械</label>
          <select id="equipmentSelect"></select>
        </div>

        <div class="field">
          <label for="targetSelect">目标肌群</label>
          <select id="targetSelect"></select>
        </div>

        <div class="filter-label">快速筛选</div>
        <div class="quick" id="quickFilters"></div>

        <div class="notice">
          数据来自 <a href="https://github.com/hasaneyldrm/exercises-dataset" target="_blank" rel="noopener">hasaneyldrm/exercises-dataset</a>。原仓库说明媒体文件不随数据集分发，所以此页不显示动作图片或 GIF。
        </div>
      </aside>

      <section class="results" aria-label="动作列表">
        <div class="results-top">
          <div class="count" id="resultCount">加载中...</div>
          <div class="hint">点击任意动作查看步骤；搜索支持英文名、部位、器械和肌群。</div>
        </div>
        <div class="list" id="exerciseList"></div>
      </section>

      <aside class="detail" id="detailPanel" aria-label="动作详情">
        <div class="detail-placeholder">数据加载后会自动打开第一个动作。也可以从列表里点选其它动作。</div>
      </aside>
    </section>
  </main>

  <script src="/exercises.js" defer></script>
  <script src="/analytics.js" defer></script>
</body>
</html>
